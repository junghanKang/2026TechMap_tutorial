name: Deploy SafeDial Tutorial

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-docc.yml
      - SafeDial/**
      - SOURCE_COMMIT
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  SKETCH_ROOT: ${{ github.workspace }}/SafeDial
  SOURCE_REF: 34eb1b964f77f12b5deeee6b65e655904710bea6
  EXPECTED_ZIP_SHA256: 552ce777b79fbcb3a1f926e814f7db84a4c4db5d739ee1c448637fa22655f08f

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out release snapshot
        uses: actions/checkout@v6

      - name: Verify source record
        run: |
          test "$(tr -d '\n' < SOURCE_COMMIT)" = "$SOURCE_REF"
          test -d "$SKETCH_ROOT"

      - name: Validate tutorial media and snapshots
        run: |
          cd "$SKETCH_ROOT"
          python3 Tools/validate_tutorial_media.py
          ./Tools/validate_tutorial_code_snapshots.sh

      - name: Run runtime regression checks
        run: |
          cd "$SKETCH_ROOT"
          ./Tools/headless-sim/run.sh
          ./Tools/depth-zone-sim/run.sh
          python3 Tools/validate_gain_ownership.py

      - name: Build and validate DocC archive
        run: |
          cd "$SKETCH_ROOT"
          xcodebuild docbuild \
            -project safe-dial.xcodeproj \
            -scheme safe-dial \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/docc-derived" \
            CODE_SIGNING_ALLOWED=NO \
            DOCC_HOSTING_BASE_PATH=2026TechMap_tutorial

          archive_count=$(find "$RUNNER_TEMP/docc-derived" -type d -name '*.doccarchive' | wc -l | tr -d ' ')
          test "$archive_count" -eq 1
          archive=$(find "$RUNNER_TEMP/docc-derived" -type d -name '*.doccarchive' -print -quit)
          python3 Tools/validate_docc_navigation.py "$archive"

          diagnostics=$(find "$RUNNER_TEMP/docc-derived" -type f -name '*diagnostics.json' -print -quit)
          test -n "$diagnostics"
          test "$(jq '.diagnostics | length' "$diagnostics")" -eq 0
          echo "DOCC_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Create reproducible learner ZIP
        run: |
          "$SKETCH_ROOT/Tools/package_tutorial_project.sh" \
            "$RUNNER_TEMP/SafeDial-Tutorial-a.zip"
          "$SKETCH_ROOT/Tools/package_tutorial_project.sh" \
            "$RUNNER_TEMP/SafeDial-Tutorial-b.zip"
          cmp \
            "$RUNNER_TEMP/SafeDial-Tutorial-a.zip" \
            "$RUNNER_TEMP/SafeDial-Tutorial-b.zip"
          cmp \
            "$RUNNER_TEMP/SafeDial-Tutorial-a.zip" \
            "$SKETCH_ROOT/safe-dial/SafeDial.docc/Resources/Downloads/SafeDial-Tutorial.zip"

          zip_sha=$(shasum -a 256 "$RUNNER_TEMP/SafeDial-Tutorial-a.zip" | awk '{print $1}')
          test "$zip_sha" = "$EXPECTED_ZIP_SHA256"
          echo "ZIP_SHA256=$zip_sha" >> "$GITHUB_ENV"

      - name: Build extracted learner project
        run: |
          mkdir -p "$RUNNER_TEMP/learner"
          unzip -q "$RUNNER_TEMP/SafeDial-Tutorial-a.zip" -d "$RUNNER_TEMP/learner"
          cd "$RUNNER_TEMP/learner/SafeDial-Tutorial"

          xcodebuild \
            -project safe-dial.xcodeproj \
            -scheme safe-dial \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/learner-debug" \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project safe-dial.xcodeproj \
            -scheme safe-dial \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/learner-release" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Prepare static site and redirects
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/downloads" "$site/tutorials"
          cp -R "$DOCC_ARCHIVE"/. "$site"/
          cp "$RUNNER_TEMP/SafeDial-Tutorial-a.zip" \
            "$site/downloads/SafeDial-Tutorial.zip"

          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="ko">' \
            '<meta charset="utf-8">' \
            '<title>SafeDial 튜토리얼로 이동</title>' \
            '<meta http-equiv="refresh" content="0; url=./tutorials/safedial/">' \
            '<script>window.location.replace("./tutorials/safedial/" + window.location.search + window.location.hash);</script>' \
            '<body><a href="./tutorials/safedial/">SafeDial 튜토리얼 열기</a></body>' \
            '</html>' > "$site/index.html"

          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="ko">' \
            '<meta charset="utf-8">' \
            '<title>SafeDial 튜토리얼로 이동</title>' \
            '<meta http-equiv="refresh" content="0; url=./safedial/">' \
            '<script>window.location.replace("./safedial/" + window.location.search + window.location.hash);</script>' \
            '<body><a href="./safedial/">SafeDial 튜토리얼 열기</a></body>' \
            '</html>' > "$site/tutorials/index.html"

          test -f "$site/tutorials/safedial/index.html"
          test -f "$site/downloads/SafeDial-Tutorial.zip"
          shasum -a 256 "$site/downloads/SafeDial-Tutorial.zip"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
