name: Deploy DocC Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build DocC archive
        run: |
          xcodebuild docbuild \
            -project safe-dial.xcodeproj \
            -scheme safe-dial \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/docc-derived" \
            CODE_SIGNING_ALLOWED=NO \
            DOCC_HOSTING_BASE_PATH=2026TechMap_tutorial

      - name: Prepare static site
        run: |
          archive="$(find "$RUNNER_TEMP/docc-derived" -type d -name '*.doccarchive' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/site"
          cp -R "$archive"/. "$RUNNER_TEMP/site"/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
